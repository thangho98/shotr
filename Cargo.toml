[package]
name = "shotr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Screenshot beautifier: capture, compose, annotate, redact, export."
repository = "https://github.com/thangho98/shotr"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.6.1"
directories = "6.0.0"
eframe = "0.34.3"
image = "0.25.10"
ocrs = "0.12.2"
regex = "1.13.1"
rfd = "0.17.2"
rten = "0.24"
rten-imageproc = "0.24"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
xcap = { version = "0.9.6", features = ["image"] }

# Linux-only: the tray speaks StatusNotifierItem over D-Bus (no GTK needed), and
# window listing/capture speaks the Wayland toplevel protocols directly, because
# xcap's window path returns an empty list on Wayland compositors.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# Windows and macOS: `tray-icon` speaks Shell_NotifyIcon and NSStatusItem. It is
# deliberately *not* used on Linux — there it hard-requires GTK3, libxdo and
# libappindicator, which is exactly the C dependency ksni lets this project do
# without. Default features off for the same reason: they are the Linux ones.
#
# The tray needs a platform event loop on its own thread, so winit comes with
# it. That is not a new dependency in practice — eframe already pulls the same
# 0.30 in — but the daemon uses it directly, so it is declared directly.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
winit = "0.30.13"

# macOS-only: global capture hotkeys. Linux does not need this — COSMIC and
# GNOME already bind a command to a key, and this crate's Linux path is X11 only
# regardless. Windows could use it, but nothing calls it there yet.
#
# Carbon's `RegisterEventHotKey` underneath, which needs no Accessibility grant:
# measured, see `plans/reports/260809-1151-macos-global-hotkeys.md`. MIT or
# Apache-2.0, and Apache-2.0 combines into GPL-3.0 in the direction this needs.
[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8.0"

# The "Desktop" background, and only that. macOS keeps no *file* for a dynamic or
# aerial wallpaper — `System Events` answers `missing value` — so the wallpaper
# has to be read off the screen instead, and the window to read it from is only
# reachable through `CGWindowListCopyWindowInfo`. `xcap` cannot help: measured, it
# filters desktop-level windows out of its list entirely.
#
# Not a new build: eframe and arboard already pull both crates in on macOS, so
# these lines only make a transitive dependency a declared one. MIT, which
# combines into GPL-3.0. Note this is the window *list*, not
# `CGWindowListCreateImage` — the obsoleted call the capture path stays away from.
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"

[profile.release]
# The OCR stack (rten) drags in a lot of symbols; stripping roughly halves the
# installed binary and costs nothing at runtime.
strip = true
