name: build

on:
  push:
    tags: ["v*"]
  # Publishing from the Releases page creates the tag too, so that one action
  # fires both triggers. The concurrency group below is what keeps it to one
  # build; without it the same tag would be built twice, in parallel, and both
  # runs would upload to the same release.
  release:
    types: [published]
  workflow_dispatch:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Correctness runs once, on Linux — the test suite touches no platform API, so
  # running it three times would only cost minutes.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version named here on purpose: rust-toolchain.toml holds it, and two
      # places to bump is one place to forget. With no argument this installs
      # what that file says, clippy included, and rustup's directory override
      # makes it the toolchain every cargo call below runs on — the same one a
      # developer gets by entering the directory.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # xcap's Linux backend reaches libpipewire, libdrm and gbm through -sys
      # crates, so their headers must be here before anything compiles at all —
      # the first run of this workflow died in libspa-sys's build script. A
      # desktop distribution has them already, which is why a checkout and a
      # Rust toolchain really is the whole setup on a developer's machine, and
      # is not on a bare runner.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libpipewire-0.3-dev libdrm-dev libgbm-dev
      - name: Zero warnings, not few
        run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: packaging/build-linux.sh
          - os: windows-latest
            script: packaging/build-windows.sh
            target: x86_64-pc-windows-msvc
          # macOS cannot be cross-compiled: Apple's SDK is not redistributable,
          # so this is the only place the .app can be built.
          - os: macos-latest
            script: packaging/build-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install   # the version rust-toolchain.toml names
      - uses: Swatinem/rust-cache@v2

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libpipewire-0.3-dev libdrm-dev libgbm-dev

      - name: NSIS for the Windows installer
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: shotr-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # `append_body`, not `body`: publishing from the Releases page means notes
      # were written by hand, and replacing them would throw away the reason for
      # doing it that way. Creating the release from a tag push does not loop
      # back here — GitHub does not start a workflow from an event raised with
      # the default GITHUB_TOKEN.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          append_body: true
          body: |
            Unsigned. Windows and macOS will warn on first launch.
            macOS: right-click the app and choose Open.
